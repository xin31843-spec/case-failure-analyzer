[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-failure-analyzer"
version = "1.3.0"
description = "Portable, zero-dependency, evidence-first causal failure analyzer for computational chemistry, ML interatomic potentials (MLIP), and scientific computing benchmarks."
requires-python = ">=3.9"
# Runtime dependencies stay empty: the analyzer is a portable, stdlib-only skill.
# Test tooling lives in the `dev` extra and is never needed to run an analysis.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4.0",
]

[tool.setuptools]
# Script-only skill: `scripts/` and `tests/` are invoked by path, not imported as
# an installed distribution. Declaring no packages keeps `pip install -e ".[dev]"`
# deterministic instead of letting setuptools flat-layout auto-discovery guess.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E4", "E7", "E9",   # pycodestyle syntax & structure errors
    "F",                # Pyflakes (undefined variables, unused imports, logical defects)
    "B",                # flake8-bugbear (common pitfalls, anti-patterns)
    "W",                # pycodestyle warnings
]
ignore = [
    "E741",             # ambiguous variable name (common in scientific equations, e.g. l, I)
    "B008",             # function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "E402",             # sys.path.insert before sibling imports in standalone scripts
]
"tests/*" = [
    "E402",             # sys.path.insert before local imports in test harnesses
    "F401",             # unused imports in test fixtures
    "F841",             # unused variables in assertions
]
"scripts/attribution/__init__.py" = [
    "F401",             # public re-exports
]